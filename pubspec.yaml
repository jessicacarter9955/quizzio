name: wordweaver
description: "Boost your language skills with our fun, customizable quiz app! Select your language pair and topics, then master new vocabulary through engaging quizzes, all while enjoying a sleek interface with dark mode and flag emojis."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  shared_preferences: ^2.0.0
  file_picker: '>=8.1.2'
  intl: ^0.20.2
  flutter_tts: ^3.8.0
  speech_to_text: ^7.3.0
  record: ^6.1.2
  just_audio: ^0.9.37
  http: ^1.2.0
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/dreamflow_icon.jpg
  remove_alpha_ios: true

