name: Quiz Lab Yellow Language Quiz ARM64 RELEASE
on:
  push:
    branches: [quiz-lab-apk-builder]
    paths:
      - 'release-payload-v19/**'
      - 'flutter-overrides/v18/**'
      - '.github/workflows/quiz-lab-apk.yml'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Reassemble verified Flutter source
        run: |
          set -euo pipefail
          cat release-payload-v19/part*.b64 | base64 --decode > quiz-lab-payload-v19.zip
          echo 'efbe546ef39adc1330cf7b588a50fc642e668683585da6842890b9e034632eb9  quiz-lab-payload-v19.zip' | sha256sum -c -
          mkdir -p quiz_lab_src
          unzip -q quiz-lab-payload-v19.zip -d quiz_lab_src
          test -f quiz_lab_src/Quiz-Lab-Flutter/lib/ui/pattern_screen.dart
          test -f quiz_lab_src/Quiz-Lab-Flutter/test/pattern_index_test.dart
          cp flutter-overrides/v18/stats_screen.dart quiz_lab_src/Quiz-Lab-Flutter/lib/ui/stats_screen.dart
      - name: Generate native Android project exactly as proven working releases
        run: |
          flutter create --org dev.quizlab --project-name quiz_app --platforms=android quiz_lab_build
          rm -rf quiz_lab_build/lib quiz_lab_build/test
          cp -R quiz_lab_src/Quiz-Lab-Flutter/{lib,test,assets} quiz_lab_build/
          cp quiz_lab_src/Quiz-Lab-Flutter/pubspec.yaml quiz_lab_build/pubspec.yaml
          bash quiz_lab_src/Quiz-Lab-Flutter/scripts/prepare_android_manifest.sh quiz_lab_build
          sed -i 's/android:label="quiz_app"/android:label="Quiz Lab Yellow"/' quiz_lab_build/android/app/src/main/AndroidManifest.xml
          # A preview application ID avoids destructive uninstall of the v18 APK,
          # whose ephemeral CI debug-signing key differs from this release.
          GRADLE_FILE=quiz_lab_build/android/app/build.gradle.kts
          grep -q 'applicationId = "dev.quizlab.quiz_app"' "$GRADLE_FILE"
          sed -i 's/applicationId = "dev.quizlab.quiz_app"/applicationId = "dev.quizlab.quiz_app.yellowpreview"/' "$GRADLE_FILE"
          grep -q 'applicationId = "dev.quizlab.quiz_app.yellowpreview"' "$GRADLE_FILE"
      - name: Resolve dependencies
        working-directory: quiz_lab_build
        run: flutter pub get
      - name: Analyze all app Dart files (catch UI syntax before Gradle)
        working-directory: quiz_lab_build
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Dart and Flutter tests
        working-directory: quiz_lab_build
        run: flutter test
      - name: Build RELEASE APK for OnePlus 8 (ARM64 only)
        working-directory: quiz_lab_build
        run: |
          flutter build apk --release --target-platform android-arm64 --tree-shake-icons
          mkdir -p ../apk_outputs
          cp build/app/outputs/flutter-apk/app-release.apk ../apk_outputs/Quiz-Lab-Yellow-Language-Quiz-ARM64-Release-v19-Preview.apk
      - name: Verify RELEASE APK integrity and signature
        run: |
          set -euo pipefail
          APK=apk_outputs/Quiz-Lab-Yellow-Language-Quiz-ARM64-Release-v19-Preview.apk
          test -s "$APK"
          unzip -tq "$APK" > /dev/null
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -n "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose --print-certs "$APK"
          unzip -Z1 "$APK" | grep -q 'lib/arm64-v8a/libapp.so'
          unzip -Z1 "$APK" | grep -q 'lib/arm64-v8a/libflutter.so'
          ls -lh "$APK"
          sha256sum "$APK"
      - name: Publish signed RELEASE APK
        uses: actions/upload-artifact@v4
        with:
          name: Quiz-Lab-Yellow-Language-Quiz-ARM64-Release-v19-Preview
          path: apk_outputs/Quiz-Lab-Yellow-Language-Quiz-ARM64-Release-v19-Preview.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish stable GitHub Release download
        if: github.ref == 'refs/heads/quiz-lab-apk-builder'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APK=apk_outputs/Quiz-Lab-Yellow-Language-Quiz-ARM64-Release-v19-Preview.apk
          if gh release view v19-preview >/dev/null 2>&1; then
            gh release upload v19-preview "$APK" --clobber
          else
            gh release create v19-preview "$APK" \
              --title 'Quiz Lab Yellow · v19 Preview (ARM64)' \
              --notes 'Android ARM64 release APK. Preview application ID: dev.quizlab.quiz_app.yellowpreview. Generated by verified GitHub Actions build. Existing preview installs with different signing certificates may require removal before reinstalling; back up local progress first.' \
              --latest
          fi
          gh release view v19-preview --json url,assets
          echo "STABLE_APK=https://github.com/${GH_REPO}/releases/download/v19-preview/$(basename "$APK")"