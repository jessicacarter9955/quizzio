name: Quiz Lab Android RELEASE (isolated builder)
on:
  push:
    branches: [quiz-lab-apk-builder]
    paths:
      - 'quiz-lab-payload.zip'
      - '.github/workflows/quiz-lab-apk.yml'
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Unpack Quiz Lab
        run: |
          mkdir -p quiz_lab_src
          unzip -q quiz-lab-payload.zip -d quiz_lab_src
          test -f quiz_lab_src/Quiz-Lab-Flutter/lib/main.dart
      - name: Generate native Android project
        run: |
          flutter create --org dev.quizlab --project-name quiz_app --platforms=android quiz_lab_build
          rm -rf quiz_lab_build/lib quiz_lab_build/test
          cp -R quiz_lab_src/Quiz-Lab-Flutter/{lib,test,assets} quiz_lab_build/
          cp quiz_lab_src/Quiz-Lab-Flutter/pubspec.yaml quiz_lab_build/pubspec.yaml
          bash quiz_lab_src/Quiz-Lab-Flutter/scripts/prepare_android_manifest.sh quiz_lab_build
      - name: Resolve dependencies
        working-directory: quiz_lab_build
        run: flutter pub get
      - name: Run Dart tests
        working-directory: quiz_lab_build
        run: flutter test
      - name: Build ARM64 RELEASE (OnePlus 8)
        working-directory: quiz_lab_build
        run: |
          flutter build apk --release --target-platform android-arm64 --tree-shake-icons
          mkdir -p ../apk_outputs
          cp build/app/outputs/flutter-apk/app-release.apk ../apk_outputs/Quiz-Lab-ARM64-Release.apk
      - name: Build universal RELEASE (fallback)
        working-directory: quiz_lab_build
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ../apk_outputs/Quiz-Lab-Universal-Release.apk
      - name: Verify APK packages and signatures
        run: |
          set -e
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -n "$APK_SIGNER"
          for apk in apk_outputs/*.apk; do
            test -s "$apk"
            unzip -tq "$apk" >/dev/null
            "$APK_SIGNER" verify --verbose "$apk"
            ls -lh "$apk"
          done
          file apk_outputs/*.apk
      - name: Save both RELEASE APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Quiz-Lab-Release-APKs
          if-no-files-found: warn
          path: apk_outputs/*.apk
          retention-days: 30
