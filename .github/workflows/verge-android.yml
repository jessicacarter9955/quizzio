name: Paper Trading Android APK
on:
  push:
    branches:
      - ci/verge-trading-academy-apk-20261112
      - feat/verge-twelve-live-20261112
      - feat/verge-tradingview-dark-light-20261112
      - feat/verge-public-web-six-live-20261112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore source
        run: base64 -d verge-build/flutter-src.tar.xz.b64 | tar -xJf -
      - name: Wire Supabase realtime and Twelve Data charts
        run: python3 verge-build/patch_flutter.py
      - name: Apply neutral blue dark/light palette
        run: python3 verge-build/apply_tradingview_theme.py
      - name: Fix six-symbol live quotes and authenticated paper trading API
        run: python3 verge-build/patch_six_live.py
      - name: Remove synthetic OHLC and enforce authenticated paper trading
        run: python3 verge-build/patch_verified_ohlc_flutter.py
      - name: Enforce Paper Trading domain data and exact learning order
        run: python3 verge-build/paper_trading_final.py
      - name: Replace chart engine and remove vendor branding
        run: python3 verge-build/replace_chart_engine.py
      - name: Restore native student classrooms and favorites
        run: |
          cat verge-build/paper-extras-b64/{0,1,2,3,4}.txt | base64 -d | xz -dc > flutter_app/lib/paper_student_extras.dart
          echo "8e8a12483d10e070bd19f4226fe6eff9cab2efebc1da09db79a6f2fd75d07d57  flutter_app/lib/paper_student_extras.dart" | sha256sum -c -
          python3 verge-build/patch_mobile_student_extras.py
      - name: Enable native course screens, server-graded quizzes and simplified navigation
        run: |
          cat verge-build/mobile-learning-b64/{0,1,2,3,4,5}.txt | base64 -d | xz -dc > flutter_app/lib/paper_learning_mobile.dart
          echo "e33c8f174beba253a2da253e2bd3aaebcf6c249bf2ebe463f2bf21206e79e196  flutter_app/lib/paper_learning_mobile.dart" | sha256sum -c -
          base64 -d verge-build/patch_mobile_redesign.xz.b64 | xz -dc > /tmp/patch_mobile_redesign.py
          echo "0b0c833b4ad67f7f715365e839b246edf10d0f279685d59e707359fd5a261419  /tmp/patch_mobile_redesign.py" | sha256sum -c -
          python3 /tmp/patch_mobile_redesign.py
      - name: Generate Android project
        working-directory: flutter_app
        run: flutter create . --project-name verge_trading_academy --platforms=android,ios,web
      - name: Install Inter font package
        working-directory: flutter_app
        run: flutter pub add google_fonts
      - name: Generate Paper Trading launcher icons (white + blue)
        run: python3 verge-build/build_paper_trading_icon.py
      - name: Enable Android internet
        working-directory: flutter_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          data=p.read_text()
          if 'android.permission.INTERNET' not in data:
              data=data.replace('<application','<uses-permission android:name="android.permission.INTERNET" />\n    <application',1)
              p.write_text(data)
          PY
      - name: Packages
        working-directory: flutter_app
        run: flutter pub get
      - uses: actions/upload-artifact@v4
        with:
          name: paper-trading-source-review
          path: |
            flutter_app/lib/main.dart
            flutter_app/lib/paper_learning_mobile.dart
            flutter_app/assets/chart.html
          if-no-files-found: error
      - name: Use compatible Inter font family on Flutter 3.50
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('flutter_app/lib/main.dart')
          s=p.read_text()
          old="fontFamily:'Inter',textTheme:GoogleFonts.interTextTheme(),"
          assert s.count(old)==1, 'Expected Inter theme substitution once'
          p.write_text(s.replace(old,"fontFamily:GoogleFonts.inter().fontFamily,"))
          PY
      - name: Dart source sanity check
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - name: Compile Flutter Web for mobile viewport QA
        if: success()
        working-directory: flutter_app
        run: |
          flutter build web --release \
            --dart-define=API_BASE_URL=https://fcypamejorxoxvtcqubs.supabase.co/functions/v1/verge-market-api \
            --dart-define=TRADE_API_BASE_URL=https://fcypamejorxoxvtcqubs.supabase.co/functions/v1/verge-api \
            --dart-define=SUPABASE_URL=https://fcypamejorxoxvtcqubs.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_irzgokPHFHYBuS0XjzFwRQ_jEB0Yfe_
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: paper-trading-flutter-web-qa
          path: flutter_app/build/web/
          if-no-files-found: error
      - name: Compile APK release (Supabase)
        working-directory: flutter_app
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://fcypamejorxoxvtcqubs.supabase.co/functions/v1/verge-market-api \
            --dart-define=TRADE_API_BASE_URL=https://fcypamejorxoxvtcqubs.supabase.co/functions/v1/verge-api \
            --dart-define=SUPABASE_URL=https://fcypamejorxoxvtcqubs.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_irzgokPHFHYBuS0XjzFwRQ_jEB0Yfe_
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-trading-android-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

