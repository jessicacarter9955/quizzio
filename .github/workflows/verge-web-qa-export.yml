name: Paper Trading Web QA source snapshot
on:
  push:
    branches:
      - quiz-lab-apk-builder
    paths:
      - .github/workflows/verge-web-qa-export.yml
      - public/paper-trading/index.html
      - public/verge/qa-fixtures.json
      - public/paper-trading/index.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated website
        run: |
          test -s public/paper-trading/index.html
          grep -q "Twelve Data" public/paper-trading/index.html
          ! grep -q 'function syntheticCandles' public/paper-trading/index.html
      - name: Validate HTML inline JavaScript syntax and prohibit mock data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('public/paper-trading/index.html').read_text()
          parts=re.findall(r'<script\b[^>]*>(.*?)</script>',html,flags=re.S|re.I)
          assert parts, 'No JavaScript in HTML'
          for i,part in enumerate(parts):
              Path(f'/tmp/verge-script-{i}.js').write_text(part)
          print('Inline scripts:',len(parts))
          assert 'TradingView' not in html
          assert 'lightweight-charts' not in html
          assert 'echarts@5.6.0' in html
          assert 'syntheticCandles' not in html
          assert "const sample=" not in html
          PY
          for f in /tmp/verge-script-*.js; do node --check "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: verge-live-web-qa-source
          path: |
            public/paper-trading/index.html
            public/verge/qa-fixtures.json
            public/paper-trading/paper-trading-icon.svg
          if-no-files-found: error
