name: VERGE Web QA source snapshot
on:
  push:
    branches:
      - quiz-lab-apk-builder
    paths:
      - .github/workflows/verge-web-qa-export.yml
      - public/verge/index.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated website
        run: |
          test -s public/verge/index.html
          grep -q "Twelve Data" public/verge/index.html
          ! grep -q 'function syntheticCandles' public/verge/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: verge-live-web-qa-source
          path: public/verge/index.html
          if-no-files-found: error
