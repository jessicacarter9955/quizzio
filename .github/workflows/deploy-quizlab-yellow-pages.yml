name: Deploy Quiz Lab yellow web to GitHub Pages

on:
  push:
    branches:
      - quizlab-yellow-web-pages
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quizlab-yellow-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Quiz Lab web source
        uses: actions/checkout@v4

      - name: Assemble the cream/yellow responsive web app
        shell: bash
        run: |
          set -euo pipefail
          test -s web-responsive-index.html
          test -s web-v2-app.js
          test -s web-mobile-payload.zip

          rm -rf dist
          mkdir -p dist

          cp web-responsive-index.html dist/index.html
          cp web-v2-app.js dist/app.js
          unzip -p web-mobile-payload.zip data.js > dist/data.js

          test -s dist/index.html
          test -s dist/app.js
          test -s dist/data.js
          grep -q 'src="data.js"' dist/index.html
          grep -q 'src="app.js?v=' dist/index.html

          node --check dist/app.js
          node --check dist/data.js

          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const context = { window: {} };
          vm.runInNewContext(fs.readFileSync('dist/data.js', 'utf8'), context, { timeout: 10000 });
          const terms = context.window.QUIZLAB_DATA;
          if (!Array.isArray(terms) || terms.length === 0) {
            throw new Error('data.js did not expose a non-empty window.QUIZLAB_DATA array');
          }
          const valid = terms.filter(t => t && t.id && t.t && Object.keys(t.t).length >= 2);
          if (valid.length === 0) {
            throw new Error('Vocabulary dataset has no valid multilingual terms');
          }
          const phrases = valid.filter(t => t.k === 'phrase');
          if (phrases.length === 0) {
            throw new Error('Phrase dataset is missing');
          }
          console.log('Validated ' + valid.length + ' multilingual vocabulary records, including ' + phrases.length + ' phrases.');
          NODE

          grep -q 'quizLimit' dist/app.js
          grep -q 'PREFERRED_RATINGS' dist/app.js
          grep -q 'patternSelectedPlay' dist/app.js
          grep -q 'function phrasesView' dist/app.js
          grep -q 'function startCollectionQuiz' dist/app.js
          grep -q 'data-collection-difficulty' dist/app.js
          grep -q 'data-collection-category' dist/app.js
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const source = fs.readFileSync('dist/app.js', 'utf8');
          const pairStart = source.indexOf('function savedWordPairOptions(');
          const matchesStart = source.indexOf('function savedWordPairMatches(', pairStart);
          const recordsStart = source.indexOf('function collectionRecords(', matchesStart);
          if (pairStart < 0 || matchesStart < 0 || recordsStart < 0) throw new Error('Saved reverse-pair helpers are missing');
          const helpers = source.slice(pairStart, matchesStart) + source.slice(matchesStart, recordsStart);
          const sandbox = {};
          vm.runInNewContext(helpers + '\nglobalThis.pairOptions=savedWordPairOptions;globalThis.pairMatches=savedWordPairMatches;', sandbox);
          const words = [{src:'en',dst:'es'},{src:'fr',dst:'de'}];
          const options = Array.from(sandbox.pairOptions(words));
          for (const pair of ['en>es','es>en','fr>de','de>fr']) if (!options.includes(pair)) throw new Error('Missing saved language pair: ' + pair);
          if (!sandbox.pairMatches({src:'en',dst:'es'},'es','en')) throw new Error('Reverse saved pair matching failed');
          if (sandbox.pairMatches({src:'en',dst:'es'},'fr','de')) throw new Error('Unrelated saved pair matched');
          console.log('Saved reverse language pairs verified.');
          NODE
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const source = fs.readFileSync('dist/app.js', 'utf8');
          const match = source.match(/function collectionSortRecords\(records,sort='alphabetical'\)\{[\s\S]*?\n\}/);
          if (!match) throw new Error('Saved collection sort helper is missing');
          const sandbox = {};
          vm.runInNewContext(match[0] + '\nglobalThis.sortRecords = collectionSortRecords;', sandbox);
          const sample = [
            {sourceText:'pear',rating:'easy'},
            {sourceText:'fig',rating:'difficult'},
            {sourceText:'banana',rating:'medium'},
            {sourceText:'plum',rating:null}
          ];
          const order = mode => Array.from(sandbox.sortRecords(sample, mode), item => item.sourceText).join(',');
          if (order('alphabetical') !== 'banana,fig,pear,plum') throw new Error('Alphabetical saved sort failed: ' + order('alphabetical'));
          if (order('length') !== 'fig,pear,plum,banana') throw new Error('Letter-count saved sort failed: ' + order('length'));
          if (order('difficulty') !== 'fig,banana,pear,plum') throw new Error('Difficulty saved sort failed: ' + order('difficulty'));
          console.log('Saved collection sorting verified: alphabetical, letter count, and difficulty.');
          NODE
          grep -q 'data-collection-category-sort' dist/app.js
          grep -q 'categorySort' dist/app.js
          grep -q "preferredSort:'alphabetical'" dist/app.js
          grep -q 'function collectionSortRecords' dist/app.js
          grep -q 'data-collection-sort="word"' dist/app.js
          grep -q 'saved-category-group' dist/app.js
          grep -q 'saved-category-heading' dist/app.js
          grep -q 'function savedWordPairOptions' dist/app.js
          grep -q 'function savedWordPairMatches' dist/app.js
          grep -q 'displaySrc:src,displayDst:dst' dist/app.js
          grep -q 'data-saved-category-toggle' dist/app.js
          grep -q 'saved-category-items.is-collapsed' dist/index.html
          grep -q 'data-pattern-selected-cloud' dist/app.js
          grep -q 'function renderWordCloudLayouts' dist/app.js
          grep -q 'data-wordcloud-svg' dist/app.js
          grep -q 'window.d3Cloud' dist/app.js
          grep -q 'd3-cloud@1/+esm' dist/index.html
          grep -q "case 'wordcloud'" dist/app.js
          grep -q "case 'phrases'" dist/app.js
          grep -q 'wordCloudPageSize' dist/app.js
          grep -q 'data-wordcloud-occlusion' dist/app.js
          grep -q 'function startWordCloudSpeech' dist/app.js
          grep -q 'function findWordCloudSpeechMatch' dist/app.js
          grep -q 'data-wordcloud-speech-toggle' dist/app.js
          grep -q 'SpeechRecognition' dist/app.js
          grep -q 'cloud-word.spoken' dist/index.html
          grep -q 'wordCloudPageIndex' dist/app.js
          grep -q 'data-wordcloud-page' dist/app.js
          grep -q 'function renderWordCloudFallback' dist/app.js
          grep -q 'wordcloud-fullscreen' dist/index.html
          grep -q 'position:fixed;inset:0' dist/index.html
          grep -q 'wordcloud-fallback' dist/index.html
          grep -q 'size:A4 landscape' dist/index.html
          grep -q '#view.wordcloud-portal .wordcloud-pages{display:block!important;flex:none!important;width:297mm!important;height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important}' dist/index.html
          grep -q '#view.wordcloud-portal .wordcloud-sheet.active' dist/index.html
          grep -q 'break-after:page!important' dist/index.html
          grep -q 'wordCloudLayoutPromise' dist/app.js
          grep -q 'printWordCloudAfterReady' dist/app.js
          grep -q 'Preparing all pages' dist/app.js
          grep -q '#view.wordcloud-portal .wordcloud-pages{display:block!important;flex:none!important;width:297mm!important;height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important}' dist/index.html
          grep -q 'body.wordcloud-active .app-shell{display:none!important}' dist/index.html
          grep -q 'page-break-after:always!important' dist/index.html
          grep -q 'wordCloudLayoutPromise' dist/app.js
          grep -q 'Preparing all pages' dist/app.js
          grep -q '#view.wordcloud-portal .wordcloud-sheet:not(.active){display:flex!important}' dist/index.html
          grep -q 'id="wordCloudFullscreen"' dist/app.js
          grep -q 'wordCloudLayoutRun' dist/app.js
          grep -q 'wordcloud-stage' dist/app.js
          grep -q 'max-width:none!important' dist/index.html
          grep -q 'document.body.appendChild(view)' dist/app.js
          grep -q 'wordcloud-portal' dist/app.js
          grep -q '#view.wordcloud-portal' dist/index.html
          grep -q 'wordcloud-sheet:not(.active)' dist/index.html
          grep -q 'const required=words.length' dist/app.js
          grep -q "group.removeAttribute('transform')" dist/app.js
          if grep -q "group.setAttribute('transform'" dist/app.js; then
            echo "Word cloud must not reapply the off-canvas group transform."
            exit 1
          fi
          echo "Saved words alphabetical/category grouping, reversible saved language pairs, collapsible category groups, three saved-word sort modes, Saved/Phrases filters, full-body viewport word-cloud portal, single-page display, D3 placement without off-canvas transforms, speech recognition, and A4 print sheets are present."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: wordweaver-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy Quiz Lab web
        id: deployment
        uses: actions/deploy-pages@v4
