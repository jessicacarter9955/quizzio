name: Paper Trading Flutter UI smoke test
on:
  push:
    branches: [quiz-lab-apk-builder]
    paths:
      - qa/paper-trading-flutter.mjs
      - .github/workflows/paper-trading-flutter-qa.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download compiled Flutter Web from successful Android workflow
        uses: actions/download-artifact@v4
        with:
          name: paper-trading-flutter-web-qa
          run-id: 43411677768
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: flutter-preview
      - name: Set up browser QA runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium ffmpeg
      - name: Serve Flutter app from localhost
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory flutter-preview > /tmp/flutter-qa-server.log 2>&1 &
          sleep 2
          curl -fI http://127.0.0.1:8765/
      - name: Exercise compiled Flutter UI
        run: node qa/paper-trading-flutter.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-trading-flutter-ui-evidence
          path: flutter-qa/
          if-no-files-found: warn
