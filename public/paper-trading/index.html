function fallbackChart(holder,candles){
  holder.innerHTML='<canvas aria-label="Historical Twelve Data OHLC chart" style="width:100%;height:100%;display:block"></canvas>';
  const canvas=holder.querySelector('canvas');const ctx=canvas.getContext('2d');
  function paint(){const w=holder.clientWidth,h=holder.clientHeight,ratio=window.devicePixelRatio||1;canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);
    const pad={left:7,right:62,top:15,bottom:23},cw=w-pad.left-pad.right,ch=h-pad.top-pad.bottom;
    const min=Math.min(...candles.map(c=>c.low)),max=Math.max(...candles.map(c=>c.high));const range=Math.max(max-min,.00001);
    ctx.font='10px DM Sans, sans-serif';ctx.textBaseline='middle';for(let i=0;i<=4;i++){const y=pad.top+ch*i/4;ctx.strokeStyle=css('--chart-grid');ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w-43,y);ctx.stroke();ctx.fillStyle=css('--muted');ctx.fillText(fmtPrice(max-range*i/4),w-56,y-7)}
    const spacing=cw/candles.length;const bar=Math.max(2,Math.min(9,spacing*.65));
    candles.forEach((c,i)=>{const x=pad.left+(i+.5)*spacing;const y=n=>pad.top+(max-n)/range*ch;const rise=c.close>=c.open;ctx.strokeStyle=ctx.fillStyle=rise?css('--positive'):css('--negative');ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y(c.high));ctx.lineTo(x,y(c.low));ctx.stroke();const a=y(c.open),b=y(c.close);ctx.fillRect(x-bar/2,Math.min(a,b),bar,Math.max(1,Math.abs(a-b)));});
    ctx.fillStyle=css('--muted');ctx.font='10px DM Sans, sans-serif';for(let i=0;i<5;i++){const index=Math.round((candles.length-1)*i/4);const time=new Date(candles[index].time*1000);ctx.fillText(time.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),pad.left+index*spacing,h-8)}
  }
  paint();state.resizeObserver=new ResizeObserver(paint);state.resizeObserver.observe(holder);
}
function acceptQuote(q){
 if(!q||!state.prices[q.symbol]||!Number.isFinite(Number(q.price))||Number(q.price)<=0)return;
 // A REST quote is not an OHLC candle. Never create chart candles from arrival timestamps.
 state.prices[q.symbol]={...q,price:Number(q.price)};
 if(q.source==='TWELVE_DATA'&&state.mode!=='live'){state.mode='live';setupNav();}
 if(q.symbol!==state.symbol)return;
 const p=$('#order-price'),total=$('#order-notional'),asset=$('.asset-price b');
 if(p)p.textContent=fmtPrice(q.price);if(total)total.textContent=money(q.price*state.qty);if(asset)asset.textContent=fmtPrice(q.price);const status=$('.asset-price span');if(status&&window.tradingMarketLabel)status.textContent=window.tradingMarketLabel(q.symbol);
}
