const priceOf=s=>state.prices[s]?.price||0;const names=Object.fromEntries(assets.map(([k,n])=>[k,n]));const symDisplay=s=>s==='BTC/USD'?'BTC':s==='EUR/USD'?'EUR':s;

function syncThemeControls(){const light=document.documentElement.dataset.theme==='light';const icon=document.getElementById('theme-icon'),label=document.getElementById('theme-word'),button=document.getElementById('theme-toggle');if(icon)icon.textContent=light?'☾':'☀';if(label)label.textContent=light?'Dark':'Light';if(button){button.setAttribute('aria-pressed',String(light));button.title=light?'Switch to dark mode':'Switch to light mode';}const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=light?'#f8f9fd':'#131722';}

const intro=(small,title,sub,button)=>`<section class="page-intro"><div><div class="eyebrow">${small}</div><h1>${title}</h1><p>${sub}</p></div>${button||''}</section>`;
function stat(label,value,detail,symbol){return `<div class="card stat"><div class="stat-label">${label}<span class="stat-icon">${symbol}</span></div><div class="stat-value">${value}</div><div class="stat-bottom">${detail}</div></div>`}

const fmtPrice=p=>Number(p)>1000?money(p):Number(p)>10?money(p):Number(p).toFixed(5);
function homePage(){return intro('THE TRADING CLASSROOM','Good to see you, trader 👋','Practice your skills. Understand the market. Build confidence.',`<button class="primary-button" onclick="navigate('trade')">+ Place Paper Trade</button>`)+summaryCards()+`<section class="dashboard-grid"><div class="card chart-panel"><div class="panel-heading"><div><h2>Market Overview</h2><p>Track price movements and explore the charts</p></div><div class="timeframes">${intervalButtons()}</div></div>${selectedAsset()}<div class="chart" id="trade-chart"></div><div class="chart-legend"><span class="mini-chart-label">Loading verified OHLC · ${state.interval}</span><span>Powered by TradingView</span></div></div><div class="card lessons-panel"><div class="panel-heading"><div><h2>Your learning journey</h2><p>Every great trader starts somewhere.</p></div><span style="color:var(--lime)">✦</span></div><div class="streak-row"><div class="streak-icon">⚡</div><div><strong>${state.portfolio.done.length} / ${state.lessonData.length}</strong><span>LESSONS COMPLETED</span></div></div><div class="progress-outer"><div class="progress-inner" style="width:${Math.round(state.portfolio.done.length/state.lessonData.length*100)}%"></div></div>${state.lessonData.slice(0,3).map((l,i)=>lessonRow(l,i)).join('')}<button class="text-link" onclick="navigate('learn')">View all lessons →</button></div></section><section class="table-grid"><div class="card table-card"><h2>Market watchlist <span onclick="navigate('trade')">Explore all ↗</span></h2>${marketTable()}</div><div class="card quick-card"><div class="eyebrow">PRACTICE MAKES PROGRESS</div><h2 style="font-size:22px;margin:14px 0">Start with a virtual portfolio.</h2><p>Explore real market concepts without risking real money. Track every decision as you learn.</p><div class="practice">$100,000<span>.</span></div><button class="primary-button" onclick="navigate('trade')">Open Trading Desk ↗</button></div></section>`}

function selectedAsset(){const symbol=state.symbol,a=assets.find(x=>x[0]===symbol)||assets[0];const q=priceOf(symbol);return `<div class="asset-current"><div class="coin-icon">${a[2]}</div><div><strong>${symDisplay(symbol)}</strong><div class="name">${a[1]}</div></div><div class="asset-price"><b>${fmtPrice(q)}</b><span class="positive">● ${state.mode==='live'?'Live quote':'Demo quote'}</span></div></div>`}

function tradePage(){return intro('TRADING SIMULATOR','Your trading desk','Analyze markets and practice placing virtual orders.')+`<div class="market-tabs">${assets.map(a=>`<button class="symbol-selector ${state.symbol===a[0]?'active':''}" onclick="selectSymbol('${a[0]}')">${symDisplay(a[0])}</button>`).join('')}</div><div class="trade-layout"><div class="card chart-panel"><div class="panel-heading"><div><h2>${escapeHtml(names[state.symbol])}</h2><p>Interactive TradingView candlestick chart</p></div><div class="timeframes">${intervalButtons()}</div></div>${selectedAsset()}<div class="chart" id="trade-chart"></div><div class="chart-legend"><span>Loading verified Twelve Data OHLC</span><span>TradingView Lightweight Charts™</span></div></div><div class="card order-panel"><div class="panel-heading"><div><h2>Place an order</h2><p>Paper trading only — $0 at risk</p></div><span style="font-size:23px;color:var(--lime)">↗</span></div><div class="segmented"><button class="${state.side==='buy'?'active buy':''}" onclick="setSide('buy')">Buy</button><button class="${state.side==='sell'?'active sell':''}" onclick="setSide('sell')">Sell</button></div><label class="input-label">Asset</label><div class="number-input"><b>${state.symbol}</b><span style="margin-left:auto">Market</span></div><label class="input-label" for="quantity">Quantity (shares / units)</label><div class="number-input"><input id="quantity" aria-label="Quantity" type="number" step="0.01" min="0.01" value="${state.qty}" oninput="setQty(this.value)"/><span>Units</span></div><div class="order-summary"><div class="sum-line">Market price <b id="order-price">${fmtPrice(priceOf(state.symbol))}</b></div><div class="sum-line">Estimated total <b id="order-notional">${money(priceOf(state.symbol)*state.qty)}</b></div><div class="sum-line">Available cash <b>${money(state.portfolio.cash)}</b></div><div class="sum-line">Owned units <b>${fmt(state.portfolio.holdings[state.symbol]?.qty||0)}</b></div></div><button class="primary-button" onclick="placeOrder()" style="background:${state.side==='sell'?'#ff9a91':'var(--lime)'}">${state.side==='buy'?'Buy':'Sell'} ${symDisplay(state.symbol)} · Paper Trade →</button><p class="disclaimer">No live brokerage execution. Market orders are simulated. Demo quotes and candles are not real trading data.</p></div></div>`}
function setSide(v){state.side=v;render()}function setQty(v){state.qty=Number(v);const e=$('#order-notional');if(e)e.textContent=money(priceOf(state.symbol)*Math.max(0,state.qty))}function setIntervalChart(i){state.interval=i;render()}
function selectSymbol(s,openTrade=false){state.symbol=s;if(openTrade)state.page='trade';render()}
async function placeOrder(){const symbol=state.symbol,side=state.side,qty=state.qty,price=priceOf(symbol);if(!Number.isFinite(qty)||qty<=0||qty>1000000)return toast('Enter a valid quantity.');const old=state.portfolio.holdings[symbol]||{qty:0,avg:0};if(side==='buy'&&qty*price>state.portfolio.cash+.000001)return toast('Not enough virtual funds.');if(side==='sell'&&qty>old.qty+.000001)return toast('Not enough units to sell.');
  if(state.mode==='live'&&state.db){if(!state.token)return loginModal();try{const response=await fetch('https://fcypamejorxoxvtcqubs.supabase.co/functions/v1/verge-api/v1/orders',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${state.token}`},body:JSON.stringify({symbol,side,quantity:qty,client_order_id:uid()})});const result=await response.json();if(!response.ok)throw Error(result.error||'Order rejected');await loadPortfolio();toast('Paper order filled via secure backend.');render();return;}catch(e){toast(`Order not placed: ${e.message}`);return}}
  const total=Math.round(qty*price*100)/100;let pnlReal=0;if(side==='buy'){state.portfolio.cash=Math.round((state.portfolio.cash-total)*100)/100;const next=old.qty+qty;state.portfolio.holdings[symbol]={qty:next,avg:(old.qty*old.avg+total)/next}}else{state.portfolio.cash=Math.round((state.portfolio.cash+total)*100)/100;pnlReal=Math.round((price-old.avg)*qty*100)/100;const next=old.qty-qty;if(next<0.000001)delete state.portfolio.holdings[symbol];else state.portfolio.holdings[symbol]={qty:next,avg:old.avg}}
  state.portfolio.orders.unshift({id:uid(),symbol,side,quantity:qty,fill_price:price,notional:total,realized_pnl:pnlReal,created_at:new Date().toISOString(),source:'DEMO'});persist();toast(`${side==='buy'?'Bought':'Sold'} ${fmt(qty)} ${symbol} — virtual order filled`);render()}

function loginModal(){if(!state.db){toast('Supabase is not connected yet. The local demo works without login.');return}$('#overlay').innerHTML=`<div class="modal-root" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modal-header"><div class="eyebrow">STUDENT ACCOUNT</div><button class="close" onclick="closeModal()">×</button></div><h2 style="margin-top:18px">Welcome back.</h2><p>Use a Supabase student account to sync lessons and trades.</p><form onsubmit="submitLogin(event)"><label class="input-label" for="email">Email</label><input class="form-input" id="email" type="email" autocomplete="email" required placeholder="student@school.edu"/><label class="input-label" for="pw">Password</label><input class="form-input" id="pw" type="password" autocomplete="current-password" minlength="6" required placeholder="••••••••"/><button class="primary-button" type="submit">Sign in</button></form><button class="text-link" style="margin-top:20px" onclick="submitLogin(null,true)">Create a student account instead →</button></div></div>`}
async function submitLogin(event,signup=false){event?.preventDefault();const email=$('#email')?.value,pw=$('#pw')?.value;if(!email||!pw)return toast('Enter an email and password.');try{const path=signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password';const r=await fetch(state.supabaseUrl+path,{method:'POST',headers:{'Content-Type':'application/json',apikey:state.supabaseKey},body:JSON.stringify({email,password:pw})});const data=await r.json();if(!r.ok)throw Error(data.msg||data.error_description||data.error||'Authentication failed');if(data.access_token){state.token=data.access_token;safeSession.setItem('verge_token',state.token);state.account=data.user;await loadPortfolio()}closeModal();toast(signup?'Account created. Confirm your email if required.':'Signed in successfully.');render()}catch(e){toast(e.message)}}
async function logout(){state.token='';state.account=null;safeSession.removeItem('verge_token');state.portfolio={cash:100000,holdings:{},orders:[],done:[]};persist();render();toast('Signed out. Local practice account loaded.')}
async function loadPortfolio(){if(!state.token)return;const [portfolio,progress]=await Promise.all([fetch('https://fcypamejorxoxvtcqubs.supabase.co/functions/v1/verge-api/v1/portfolio',{headers:{Authorization:`Bearer ${state.token}`}}),fetch(`${state.supabaseUrl}/rest/v1/pt_lesson_progress?select=lesson_id`,{headers:{apikey:state.supabaseKey,Authorization:`Bearer ${state.token}`}})]);if(!portfolio.ok)throw Error('Student portfolio not available');const obj=await portfolio.json();const holdings={};for(const p of obj.positions)if(Number(p.quantity)>0)holdings[p.symbol]={qty:Number(p.quantity),avg:Number(p.average_cost)};let done=[];if(progress.ok)done=(await progress.json()).map(r=>r.lesson_id);state.portfolio={cash:Number(obj.wallet.cash_balance),holdings,orders:obj.orders||[],done};}
async function drawChart(){
 const holder=$('#trade-chart');if(!holder)return;
 const symbol=state.symbol,interval=state.interval;
 holder.textContent='Loading genuine Twelve Data OHLC…';holder.style.display='grid';holder.style.placeItems='center';holder.style.color=css('--muted');
 let candles=[],result=null,error='';
 try{
  const url='https://fcypamejorxoxvtcqubs.supabase.co/functions/v1/verge-market-api/v1/candles/'+encodeURIComponent(symbol)+'?interval='+encodeURIComponent(interval);
  const r=await fetch(url,{headers:state.token?{Authorization:'Bearer '+state.token}:{},cache:'no-store'});
  result=await r.json();
  if(r.ok&&result.source==='TWELVE_DATA'&&result.mode==='historical'&&Array.isArray(result.candles)){
   candles=result.candles.filter(c=>[c.time,c.open,c.high,c.low,c.close].every(v=>Number.isFinite(Number(v))&&Number(v)>0)&&Number(c.high)>=Math.max(Number(c.open),Number(c.close))&&Number(c.low)<=Math.min(Number(c.open),Number(c.close))).map(c=>({time:Number(c.time),open:Number(c.open),high:Number(c.high),low:Number(c.low),close:Number(c.close)}));
   candles.sort((a,b)=>a.time-b.time);candles=candles.filter((c,i)=>i===0||c.time!==candles[i-1].time);
  }else error=String(result.error||'Provider returned no verified candles');
 }catch(e){error='Historical data request failed';}
 if(!$('#trade-chart')||$('#trade-chart')!==holder||symbol!==state.symbol||interval!==state.interval)return;
 const legend=holder.closest('.chart-panel')?.querySelector('.chart-legend span:first-child');
 if(!candles.length){
  if(state.chart){state.chart.remove?.();state.chart=null;state.series=null}
  state.candles=[];holder.textContent='No verified Twelve Data OHLC is available for this interval. No simulated graph is shown.';
  if(legend)legend.textContent='Historical data unavailable · No generated candles';
  console.warn('Market history unavailable',symbol,interval,error);return;
 }
 state.candles=candles;
 if(legend)legend.textContent='Twelve Data verified OHLC · '+interval+(result?.stale?' · Cached (provider unavailable)':'');
 if(state.chart){state.chart.remove?.();state.chart=null;state.series=null}
 holder.style.display='block';holder.style.placeItems='';holder.style.color='';holder.textContent='';
  if(!window.LightweightCharts){fallbackChart(holder,candles);return}
  const chart=LightweightCharts.createChart(holder,{width:holder.clientWidth,height:holder.clientHeight,autoSize:true,layout:{background:{type:'solid',color:css('--panel')},textColor:css('--muted'),fontSize:11},grid:{vertLines:{color:css('--chart-grid')},horzLines:{color:css('--chart-grid')}},crosshair:{vertLine:{color:css('--muted')},horzLine:{color:css('--muted')}},timeScale:{timeVisible:true,secondsVisible:false,borderColor:css('--border'),rightOffset:7},rightPriceScale:{borderColor:css('--border'),scaleMargins:{top:0.12,bottom:0.1}},handleScroll:true,handleScale:true});state.chart=chart;state.series=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:css('--positive'),downColor:css('--negative'),wickUpColor:css('--positive'),wickDownColor:css('--negative'),borderVisible:false,priceLineVisible:false});state.series.setData(candles);chart.timeScale().fitContent();}
function fallbackChart(holder,candles){
  holder.innerHTML='<canvas aria-label="Historical Twelve Data OHLC chart" style="width:100%;height:100%;display:block"></canvas>';
  const canvas=holder.querySelector('canvas');const ctx=canvas.getContext('2d');
  function paint(){const w=holder.clientWidth,h=holder.clientHeight,ratio=window.devicePixelRatio||1;canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);
    const pad={left:7,right:62,top:15,bottom:23},cw=w-pad.left-pad.right,ch=h-pad.top-pad.bottom;
    const min=Math.min(...candles.map(c=>c.low)),max=Math.max(...candles.map(c=>c.high));const range=Math.max(max-min,.00001);
    ctx.font='10px DM Sans, sans-serif';ctx.textBaseline='middle';for(let i=0;i<=4;i++){const y=pad.top+ch*i/4;ctx.strokeStyle=css('--chart-grid');ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w-43,y);ctx.stroke();ctx.fillStyle=css('--muted');ctx.fillText(fmtPrice(max-range*i/4),w-56,y-7)}
    const spacing=cw/candles.length;const bar=Math.max(2,Math.min(9,spacing*.65));
    candles.forEach((c,i)=>{const x=pad.left+(i+.5)*spacing;const y=n=>pad.top+(max-n)/range*ch;const rise=c.close>=c.open;ctx.strokeStyle=ctx.fillStyle=rise?css('--positive'):css('--negative');ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y(c.high));ctx.lineTo(x,y(c.low));ctx.stroke();const a=y(c.open),b=y(c.close);ctx.fillRect(x-bar/2,Math.min(a,b),bar,Math.max(1,Math.abs(a-b)));});
    ctx.fillStyle=css('--muted');ctx.font='10px DM Sans, sans-serif';for(let i=0;i<5;i++){const index=Math.round((candles.length-1)*i/4);const time=new Date(candles[index].time*1000);ctx.fillText(time.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),pad.left+index*spacing,h-8)}
  }
  paint();state.resizeObserver=new ResizeObserver(paint);state.resizeObserver.observe(holder);
}
function acceptQuote(q){
 if(!q||!state.prices[q.symbol]||!Number.isFinite(Number(q.price))||Number(q.price)<=0)return;
 // A REST quote is not an OHLC candle. Never create chart candles from arrival timestamps.
 state.prices[q.symbol]={...q,price:Number(q.price)};
 if(q.source==='TWELVE_DATA'&&state.mode!=='live'){state.mode='live';setupNav();}
 if(q.symbol!==state.symbol)return;
 const p=$('#order-price'),total=$('#order-notional'),asset=$('.asset-price b');
 if(p)p.textContent=fmtPrice(q.price);if(total)total.textContent=money(q.price*state.qty);if(asset)asset.textContent=fmtPrice(q.price);
}
function connectStream(){if(!location.host)return;let socket;const connect=()=>{socket=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws/quotes');socket.onmessage=e=>{try{const msg=JSON.parse(e.data);for(const q of msg.event==='snapshot'?msg.data:[msg.data])acceptQuote(q);if(state.page==='home'||state.page==='portfolio')render()}catch{}};socket.onclose=()=>setTimeout(connect,5000);socket.onerror=()=>socket.close()};connect()}
async function boot(){try{const cfg=await fetch('https://fcypamejorxoxvtcqubs.supabase.co/functions/v1/verge-api/v1/config');if(cfg.ok){const o=await cfg.json();state.db=!!(o.supabaseUrl&&o.supabasePublishableKey);state.supabaseUrl=o.supabaseUrl;state.supabaseKey=o.supabasePublishableKey;}}catch{}
 try{const [r,lessons]=await Promise.all([fetch('https://fcypamejorxoxvtcqubs.supabase.co/functions/v1/verge-market-api/v1/quotes'),fetch('https://fcypamejorxoxvtcqubs.supabase.co/functions/v1/verge-api/v1/lessons')]);if(r.ok){const d=await r.json();state.mode=d.mode;for(const q of d.quotes)acceptQuote(q)}if(lessons.ok){const d=await lessons.json();if(d.lessons?.length)state.lessonData=d.lessons}}catch{}
 if(state.token&&state.db){try{await loadPortfolio()}catch{safeSession.removeItem('verge_token');state.token=''}}render();async function pullMarketQuotes(){try{const response=await fetch('https://fcypamejorxoxvtcqubs.supabase.co/functions/v1/verge-market-api/v1/quotes',{cache:'no-store'});if(!response.ok)return;const data=await response.json();for(const q of (data.quotes||[]))acceptQuote({...q,timestamp:Math.floor(Date.parse(q.quoted_at||new Date().toISOString())/1000)});if(state.page==='home'||state.page==='portfolio')render();}catch(e){console.warn('Market quote refresh unavailable');}}setInterval(pullMarketQuotes,12000);pullMarketQuotes()}
window.navigate=navigate;window.toast=toast;window.setSide=setSide;window.setQty=setQty;window.setIntervalChart=setIntervalChart;window.selectSymbol=selectSymbol;window.placeOrder=placeOrder;window.showLesson=showLesson;window.completeLesson=completeLesson;window.closeModal=closeModal;window.resetDemo=resetDemo;window.loginModal=loginModal;window.submitLogin=submitLogin;window.logout=logout;
boot();

</script><script>(function(){var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js";s.onload=function(){if(window.navigate)window.navigate(state.page)};document.head.appendChild(s)})();</script></body></html>
