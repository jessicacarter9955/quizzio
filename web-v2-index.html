:root{--bg:#fffdf8;--bg2:#faf8f2;--card:#ffffff;--card2:#f9f6ee;--text:#181818;--muted:#89847b;--line:#ede9df;--mint:#ffd56c;--green:#30815d;--yellow:#e6a92d;--red:#c74755;--blue:#7769a7;--radius:22px}

.secondary{background:#fffefa;border:1px solid #e8e4dc;color:#242321;border-radius:14px;padding:12px;font-weight:750}.secondary:hover,.ghost:hover{background:#fff5db}

.count{color:#a5a097;font-size:11px}.label-ellipsis{line-height:1.45}
.progressbar{background:#eeeae2;height:8px;border-radius:99px}.progressfill{background:linear-gradient(90deg,#ffce5f,#ffe394);height:100%;border-radius:99px}
.question{color:#1d1c19;font-size:24px;line-height:1.4;font-weight:850;letter-spacing:-.6px;margin:21px 0 25px}

.option.wrong{background:#fff0f1;border-color:#ecb0b4;color:#a74249}.option.wrong .letter{background:#f4c9cc;color:#a74249}
.nextbox{background:#fff9e8;border:1px solid #f3e4ba;color:#26201b;border-radius:17px}.nextbox .small{color:#797365}
.game-modes{gap:9px}.game-card{background:#fffdf9;border:1px solid #ebe6df;border-radius:21px;color:#272522;padding:18px 8px;min-height:127px;box-shadow:0 2px 12px #6a511310}

.branch-mode{background:white;border:1px solid #eee3d0;color:#504639;border-radius:100px;font-size:11px;padding:7px 10px;cursor:pointer}
.branch-mode.selected{background:#24221d;border-color:#24221d;color:#fff}
.branch-limit-label{display:flex;align-items:center;gap:5px;margin-left:auto;font-size:11px;color:#756955}
.branch-limit-label select{border:1px solid #e7dac4;border-radius:9px;padding:6px;background:#fff;color:#25231e;font:inherit}
.branch-workspace{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(116px,1fr);gap:10px;align-items:start;min-width:0}
.branch-table{min-width:0;background:#fff;border:1px solid #ebe3d7;border-radius:14px;overflow:hidden;margin:0}
.branch-table-head{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid #efe9dc;background:#fff9eb}
.branch-table-head>span{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;min-width:0}
.branch-table-head strong{font-size:16px;overflow-wrap:anywhere}
.branch-table-head small{font-size:11px;color:#877c6c;white-space:nowrap}
.branch-table-head .pattern-play{font-size:11px;padding:9px 11px}
.branch-table-rows{padding:2px 11px 7px}
.branch-more{width:100%;border:0;border-top:1px solid #eee6dc;background:#fffbf1;padding:10px;color:#6e5221;font-size:11px;font-weight:800;cursor:pointer}
.branch-graph{border:1px solid #e9ddc9;border-radius:14px;background:#fffdf8;padding:12px;min-width:0;overflow:hidden}
.branch-graph-kicker{text-transform:uppercase;letter-spacing:1px;font-size:10px;font-weight:800;color:#837560;margin-bottom:8px}
.branch-graph-current{display:flex;justify-content:space-between;align-items:center;gap:7px;background:#ffdf8c;color:#282017;padding:10px;border-radius:10px;overflow-wrap:anywhere}
.branch-graph-current strong{font-size:14px;min-width:0}
.branch-graph-current>span{border-radius:100px;background:#fff6d9;font-size:11px;font-weight:800;padding:3px 8px;flex:none}
.branch-graph-nodes{margin:8px 0 0 9px;padding:4px 0 0 13px;border-left:2px solid #e0bd73;display:flex;flex-direction:column;gap:8px}
.branch-node{position:relative;display:flex;align-items:center;text-align:left;gap:5px;width:100%;min-width:0;background:#fff;border:1px solid #e9dfcd;border-radius:10px;color:#29231b;padding:10px 7px;cursor:pointer;transition:background .16s,border-color .16s}
.branch-node:hover,.branch-node:focus-visible{background:#fff0c9;border-color:#d8b560;outline:none}
.branch-node::before{content:'';position:absolute;left:-15px;top:50%;width:14px;border-top:2px solid #e0bd73}
.branch-node-letter{background:#f9ebc6;color:#654e22;font-size:12px;font-weight:850;width:22px;height:24px;border-radius:6px;display:grid;place-items:center;flex:none}
.branch-node strong{font-size:11px;overflow-wrap:anywhere;min-width:0;flex:1}
.branch-node-count{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;color:#745d30;background:#f8f0df;border-radius:7px;padding:3px 6px;flex:none}
.branch-node-arrow{font-size:16px;color:#ac9160}
.branch-terminal{margin-top:10px;color:#8b826e;font-size:11px;line-height:1.5}
@media(max-width:600px){.branch-workspace{grid-template-columns:minmax(0,1.6fr) minmax(112px,1fr);gap:7px}.branch-graph{padding:8px}.branch-table-head{padding:8px}.branch-table-head>span{display:block}.branch-table-head strong{display:block;font-size:14px}.branch-table-head .pattern-play{padding:8px 7px;font-size:10px}.branch-table-rows{padding:2px 8px}.branch-table-rows .pattern-word{display:flex;flex-direction:column;gap:4px}.branch-table-rows .pattern-word span:last-child{text-align:left}.branch-node{gap:3px;padding:9px 4px}.branch-node-letter{width:18px;height:20px;font-size:10px}.branch-node-count{padding:3px 4px}.branch-node-arrow{display:none}.branch-graph-current{padding:7px;font-size:11px}.branch-heading{align-items:flex-start}.branch-limit-label{margin-left:0}}
@media(max-width:345px){.branch-workspace{grid-template-columns:minmax(0,1fr) minmax(96px,.83fr);gap:5px}.branch-graph{padding:6px}.branch-graph-nodes{margin-left:5px;padding-left:9px}.branch-node::before{left:-11px;width:10px}.branch-node-letter{display:none}}
@media(min-width:900px){.web-responsive .branch-workspace{grid-template-columns:minmax(0,1.8fr) minmax(260px,.8fr);gap:20px}.web-responsive .branch-focused{max-width:1120px}.web-responsive .branch-table-rows{padding:7px 16px}.web-responsive .branch-graph{padding:18px}.web-responsive .branch-node{padding:12px}.web-responsive .branch-node strong{font-size:13px}}


/* v15 · focused graph: show alphabetic word lists below every immediate child */
.branch-graph-nodes{gap:10px}
.branch-node-card{position:relative;min-width:0;background:#fff;border:1px solid #e9dfcd;border-radius:11px;overflow:visible}
.branch-node-card::before{content:'';position:absolute;left:-15px;top:19px;width:14px;border-top:2px solid #e0bd73}
.branch-node-card>.branch-node{border:0;border-radius:10px 10px 0 0;background:#fff8e8}
.branch-node-card>.branch-node::before{display:none}
.branch-node-card>.branch-node:hover,.branch-node-card>.branch-node:focus-visible{background:#ffebba}
.branch-node-words{list-style:none;margin:0;padding:5px 9px 9px;display:flex;flex-direction:column;gap:0;max-height:235px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#d3b884 transparent}
.branch-node-word{font-size:11px;color:#625746;line-height:1.38;overflow-wrap:anywhere;padding:5px 0;border-bottom:1px solid #f1eadf}
.branch-node-word:last-child{border:0}
@media(max-width:600px){.branch-graph-nodes{gap:8px}.branch-node-card::before{left:-15px}.branch-node-words{padding:4px 6px 7px;max-height:245px}.branch-node-word{font-size:10px;line-height:1.35;padding:4px 0}}
@media(max-width:345px){.branch-node-card::before{left:-11px;width:10px}.branch-node-words{padding:4px}.branch-node-word{font-size:10px}}
@media(min-width:900px){.web-responsive .branch-node-word{font-size:12px}.web-responsive .branch-node-words{max-height:300px}}


/* v16 · each next-letter branch uses the same source → target pair as the main table */
.branch-node-word{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:8px;align-items:start}
.branch-node-source{min-width:0;overflow-wrap:anywhere;color:#2d2922;font-weight:700}
.branch-node-target{min-width:0;overflow-wrap:anywhere;color:#726456;text-align:right}
@media(max-width:700px){.branch-node-word{display:flex;flex-direction:column;gap:2px}.branch-node-target{text-align:left;color:#81715e;font-size:10px}}
@media(min-width:900px){.web-responsive .branch-workspace{grid-template-columns:minmax(0,1.3fr) minmax(355px,1fr)}.web-responsive .branch-node-words{max-height:360px}}
